{% extends 'service_mailing/base.html' %}
{% block title %}Детали сообщения{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card h-100 shadow-sm">  <!-- Фиксированная высота карточки -->

                <div class="card-body d-flex flex-column">  <!-- flex-column для правильного расположения -->
                    <div class="card-text mb-3">
                        <strong>Заголовок:</strong> {{message.title}}
                    </div>
                    <div class="card-text mb-3">
                        <strong>Текст сообщения:</strong> {{message.content}}
                    </div>
                    <div class="card-text mb-3">
                        <strong>Добавлен:</strong> {{message.created_at|date:"d.m.Y H:i"}}
                    </div>

                    <!-- Этот блок будет прижат к низу карточки -->
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'service_mailing:message_list' %}" class="btn btn-secondary">Назад</a>
                            <small class="text-muted">{{message.updated_at|timesince}}</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
